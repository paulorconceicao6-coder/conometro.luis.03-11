<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cronômetro simples para medir o tempo.">
    <title>Meu Cronômetro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <main class="pagina">
      <section class="cartao" aria-labelledby="titulo">
        <h2 id="tempo" aria-live="off">00:00</h2>
        <div class="controles">
          <button id="iniciar" type="button">Iniciar</button>
          <button id="pausar" type="button">Pausar</button>
          <button id="zerar" type="button">Zerar</button>
        </div>
      </section>
    </main>
  </body>
</html>
